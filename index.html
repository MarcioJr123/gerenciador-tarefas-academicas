<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
        <p>Quadro de tarefas dos projetos acadêmicos.</p>
    </header>

    <main>

        <p id="status" role="status" aria-live="polite"></p>

        <section class="filtros" aria-labelledby="titulo-busca">

            <h2 id="titulo-busca">Busca e filtros</h2>

            <form>

                <div class="campo-busca">
                    <label for="busca">Buscar tarefa por título:</label>
                    <input
                        type="search"
                        id="busca"
                        name="busca"
                        placeholder="Digite o título da tarefa"
                    >
                </div>

                <fieldset>
                    <legend>Filtrar por status</legend>

                    <div>
                        <input
                            type="radio"
                            id="status-todos"
                            name="status"
                            value="todos"
                            checked
                        >
                        <label for="status-todos">Todos</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="status-fazer"
                            name="status"
                            value="a-fazer"
                        >
                        <label for="status-fazer">A fazer</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="status-andamento"
                            name="status"
                            value="em-andamento"
                        >
                        <label for="status-andamento">Em andamento</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="status-revisao"
                            name="status"
                            value="em-revisao"
                        >
                        <label for="status-revisao">Em revisão</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="status-concluida"
                            name="status"
                            value="concluida"
                        >
                        <label for="status-concluida">Concluída</label>
                    </div>

                </fieldset>

                <fieldset>
                    <legend>Filtrar por prioridade</legend>

                    <div>
                        <input
                            type="radio"
                            id="prioridade-todas"
                            name="prioridade"
                            value="todas"
                            checked
                        >
                        <label for="prioridade-todas">Todas</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="prioridade-baixa"
                            name="prioridade"
                            value="baixa"
                        >
                        <label for="prioridade-baixa">Baixa</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="prioridade-media"
                            name="prioridade"
                            value="media"
                        >
                        <label for="prioridade-media">Média</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="prioridade-alta"
                            name="prioridade"
                            value="alta"
                        >
                        <label for="prioridade-alta">Alta</label>
                    </div>

                </fieldset>

                <div class="campo-ordenacao">

                    <label for="ordenacao">Ordenar por prazo:</label>

                    <select id="ordenacao" name="ordenacao">
                        <option value="nenhuma">Sem ordenação</option>
                        <option value="prazo-crescente">Prazo mais próximo</option>
                        <option value="prazo-decrescente">Prazo mais distante</option>
                    </select>

                </div>

                <div class="campo-limpar">

                    <button
                        type="button"
                        id="limpar-filtros"
                    >
                        Limpar filtros
                    </button>

                </div>

            </form>

        </section>

        <section
            class="quadro"
            aria-labelledby="titulo-quadro"
            data-quadro
        >

            <h2 id="titulo-quadro">Quadro de tarefas</h2>

            <section
                class="coluna coluna-a-fazer"
                aria-labelledby="titulo-a-fazer"
            >

                <h2 id="titulo-a-fazer">A fazer</h2>

                <ul data-lista-status="a-fazer"></ul>

            </section>

            <section
                class="coluna coluna-andamento"
                aria-labelledby="titulo-andamento"
            >

                <h2 id="titulo-andamento">Em andamento</h2>

                <ul data-lista-status="em-andamento"></ul>

            </section>

            <section
                class="coluna coluna-revisao"
                aria-labelledby="titulo-revisao"
            >

                <h2 id="titulo-revisao">Em revisão</h2>

                <ul data-lista-status="em-revisao"></ul>

            </section>

            <section
                class="coluna coluna-concluida"
                aria-labelledby="titulo-concluida"
            >

                <h2 id="titulo-concluida">Concluída</h2>

                <ul data-lista-status="concluida"></ul>

            </section>

        </section>

    </main>

    <footer>
        <p>Márcio Ribeiro</p>
        <p>Disciplina: Desenvolvimento Front-End</p>
    </footer>

    <script
        type="module"
        src="js/app.js"
    ></script>

</body>
</html>
